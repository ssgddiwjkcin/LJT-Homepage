# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.configure-pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@v6.0.0
        continue-on-error: true
        with:
          enablement: false
      - name: Resolve Jekyll baseurl
        id: baseurl
        run: |
          if [ -n "${{ steps.configure-pages.outputs.base_path }}" ]; then
            echo "value=${{ steps.configure-pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=/LJT-Homepage" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.baseurl.outputs.value }}"
        env:
          JEKYLL_ENV: production
      - name: Verify generated pages
        run: |
          status=0
          check() {
            label="$1"; file="$2"; pattern="$3"
            if grep -F -q "$pattern" "$file"; then
              echo "PASS $label"
            else
              echo "FAIL $label"
              status=1
            fi
          }
          test -f _site/index.html || { echo "FAIL missing index"; exit 1; }
          test -f _site/publications/index.html || { echo "FAIL missing publications index"; exit 1; }
          check "home/SynLogic" _site/index.html "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
          check "publications/SynLogic" _site/publications/index.html "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
          check "home/VLM-Chart" _site/index.html "On the Perception Bottleneck of VLMs for Chart Understanding"
          check "publications/VLM-Chart" _site/publications/index.html "On the Perception Bottleneck of VLMs for Chart Understanding"
          check "home/Truthfulness" _site/index.html "On the Universal Truthfulness Hyperplane Inside LLMs"
          check "publications/Truthfulness" _site/publications/index.html "On the Universal Truthfulness Hyperplane Inside LLMs"
          check "home/Sharpness" _site/index.html "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
          check "publications/Sharpness" _site/publications/index.html "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
          check "home/C-Eval" _site/index.html "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
          check "publications/C-Eval" _site/publications/index.html "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
          check "home/PEFT-Modules" _site/index.html "Composing Parameter-Efficient Modules with Arithmetic Operations"
          check "publications/PEFT-Modules" _site/publications/index.html "Composing Parameter-Efficient Modules with Arithmetic Operations"
          check "home/email" _site/index.html "jliugi@connect.ust.hk"
          check "home/github" _site/index.html "Vicent0205"
          check "home/scholar" _site/index.html "tbK9jl4AAAAJ"
          check "home/x" _site/index.html "junteng88716710"
          exit $status
      - name: Upload GitHub Pages artifact
        if: steps.configure-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
